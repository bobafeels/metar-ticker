<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>METAR Ticker</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    :root{
      --font-size: 40px;
      --bar-height: 85px;
      --scroll-seconds: 30s;

      --vfr:  #26983d;
      --mvfr: #2b09e8;
      --ifr:  #f51e14;
      --lifr: #c93bf9;
      --unk:  #BDBDBD;
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background: transparent;
      font-family: Arial, sans-serif;
      font-size: var(--font-size);
    }

    #ticker-wrapper {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: var(--bar-height);
      line-height: var(--bar-height);
      overflow: hidden;
      white-space: nowrap;
      background: transparent;
    }

    .ticker {
      display: inline-block;
      padding-left: 100%;
      will-change: transform;
      animation: scroll var(--scroll-seconds) linear infinite;
      font-weight: 700;
      text-shadow: 0 0 4px rgba(0,0,0,0.9);
    }

    .VFR  { color: var(--vfr);  }
    .MVFR { color: var(--mvfr); }
    .IFR  { color: var(--ifr);  }
    .LIFR { color: var(--lifr); }
    .UNK  { color: var(--unk);  }

    @keyframes scroll {
      from { transform: translateX(0%); }
      to   { transform: translateX(-100%); }
    }
  </style>
</head>

<body>
  <div id="ticker-wrapper">
    <div class="ticker UNK" id="ticker">Loading METAR…</div>
  </div>

<script>
(() => {
  /***************
   * CONFIG
   ***************/
  const STATION = "KAMW";
  const METAR_PROXY = "https://metar-ticker.sarah-cbauer11.workers.dev"; // ✅ no need for trailing slash
  const REFRESH_MS = 60_000;
  const TIMEOUT_MS = 8_000;

  let lastGoodRaw = null;

  function setTicker(text, cls = "UNK") {
    const el = document.getElementById("ticker");
    if (!el) return;
    el.className = "ticker " + cls;
    el.textContent = text;
  }

  // If anything blows up, show it on-screen instead of freezing on "Loading…"
  window.addEventListener("error", (e) => {
    setTicker("JS error: " + (e.message || "unknown"), "UNK");
  });
  window.addEventListener("unhandledrejection", (e) => {
    const msg = (e.reason && (e.reason.message || String(e.reason))) || "promise rejection";
    setTicker("Promise error: " + msg, "UNK");
  });

  function determineFlightCategory(ceilingFt, visibilitySm, raw) {
    if (visibilitySm == null) return "UNK";

    const noCeilingToken = raw && /\b(CLR|SKC|NSC)\b/.test(raw);
    if (ceilingFt == null || noCeilingToken) {
      if (visibilitySm < 1) return "LIFR";
      if (visibilitySm < 3) return "IFR";
      if (visibilitySm < 5) return "MVFR";
      return "VFR";
    }

    if (ceilingFt <= 500 || visibilitySm < 1) return "LIFR";
    if (ceilingFt <= 1000 || visibilitySm < 3) return "IFR";
    if (ceilingFt <= 3000 || visibilitySm < 5) return "MVFR";
    return "VFR";
  }

  function parseRawMetarFromNoaaTxt(txt) {
    const lines = String(txt).trim().split(/\r?\n/).map(s => s.trim()).filter(Boolean);

    // Most common NOAA TXT format:
    // line 1: timestamp
    // line 2: "KAMW 071353Z AUTO ...", often without "METAR"
    // but sometimes it can include METAR/SPECI.
    let raw = lines.find(l => /^(METAR|SPECI)\s/.test(l));
    if (raw) return raw;

    raw = lines.find(l => l.startsWith(STATION + " "));
    if (raw) return "METAR " + raw; // normalize to your preferred display format

    // fallback: any line that contains station and a 6-digit Z time
    raw = lines.find(l => l.includes(STATION) && /\b\d{6}Z\b/.test(l));
    if (raw) return raw.startsWith("METAR") || raw.startsWith("SPECI") ? raw : ("METAR " + raw);

    return null;
  }

  function parseVisibilitySm(raw) {
    // P6SM
    let m = raw.match(/\sP6SM\b/);
    if (m) return 6;

    // "2 1/2SM"
    m = raw.match(/\s(\d+)\s(\d+)\/(\d+)SM\b/);
    if (m) return Number(m[1]) + (Number(m[2]) / Number(m[3]));

    // "1/2SM"
    m = raw.match(/\s(\d+)\/(\d+)SM\b/);
    if (m) return Number(m[1]) / Number(m[2]);

    // "10SM"
    m = raw.match(/\s(\d+)SM\b/);
    if (m) return Number(m[1]);

    if (/\bCAVOK\b/.test(raw)) return 6;

    return null;
  }

  function parseCeilingFt(raw) {
    const m = raw.match(/\s(BKN|OVC|VV)(\d{3})\b/);
    return m ? parseInt(m[2], 10) * 100 : null;
  }

  async function fetchWithTimeout(url) {
    const ctrl = new AbortController();
    const t = setTimeout(() => ctrl.abort(), TIMEOUT_MS);
    try {
      const resp = await fetch(url, { cache: "no-store", signal: ctrl.signal });
      return resp;
    } finally {
      clearTimeout(t);
    }
  }

  async function update() {
    try {
      setTicker("Fetching METAR…", "UNK");

      const url = `${METAR_PROXY}?station=${encodeURIComponent(STATION)}`;
      const resp = await fetchWithTimeout(url);
      if (!resp.ok) throw new Error("HTTP " + resp.status);

      const txt = await resp.text();

      // If we ever fetch code instead of data, call it out loudly.
      if (/^\s*export\s+default\b/.test(txt)) {
        throw new Error("Proxy returned Worker source code (wrong endpoint)");
      }

      const raw = parseRawMetarFromNoaaTxt(txt);
      if (!raw) throw new Error("No METAR line in proxy response");

      lastGoodRaw = raw;

      const vis = parseVisibilitySm(raw);
      const ceil = parseCeilingFt(raw);
      const cat = determineFlightCategory(ceil, vis, raw);

      setTicker(`${cat}: ${raw}`, cat);

    } catch (err) {
      console.error("METAR update failed:", err);

      if (lastGoodRaw) {
        const vis = parseVisibilitySm(lastGoodRaw);
        const ceil = parseCeilingFt(lastGoodRaw);
        const cat = determineFlightCategory(ceil, vis, lastGoodRaw);
        setTicker(`${cat}: ${lastGoodRaw}`, cat);
      } else {
        setTicker("METAR error: " + (err.message || String(err)), "UNK");
      }
    }
  }

  update();
  setInterval(update, REFRESH_MS);
})();
</script>
</body>
</html>
