<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>METAR Ticker</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    :root{
      --font-size: 40px;
      --bar-height: 85px;
      --scroll-seconds: 30s;

      --vfr:  #26983d;
      --mvfr: #2b09e8;
      --ifr:  #f51e14;
      --lifr: #c93bf9;
      --unk:  #BDBDBD;
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background: transparent;
      font-family: Arial, sans-serif;
      font-size: var(--font-size);
    }

    #ticker-wrapper {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: var(--bar-height);
      line-height: var(--bar-height);
      overflow: hidden;
      white-space: nowrap;
      background: transparent;
    }

    .ticker {
      display: inline-block;
      padding-left: 100%;
      will-change: transform;
      animation: scroll var(--scroll-seconds) linear infinite;
      font-weight: 700;
      text-shadow: 0 0 4px rgba(0,0,0,0.9);
    }

    .VFR  { color: var(--vfr);  }
    .MVFR { color: var(--mvfr); }
    .IFR  { color: var(--ifr);  }
    .LIFR { color: var(--lifr); }
    .UNK  { color: var(--unk);  }

    @keyframes scroll {
      from { transform: translateX(0%); }
      to   { transform: translateX(-100%); }
    }
  </style>
</head>
<body>

  <div id="ticker-wrapper">
    <div class="ticker UNK" id="ticker">Loading METAR…</div>
  </div>

<script>
  /***************
   * CONFIG
   ***************/
  const STATION = "KAMW";

  // ✅ Put your Cloudflare Worker URL here
  const METAR_PROXY = "https://metar-ticker.sarah-cbauer11.workers.dev/";

  let lastGoodRaw = null;

  function withTimeout(ms) {
    const ctrl = new AbortController();
    const t = setTimeout(() => ctrl.abort(), ms);
    return { ctrl, cleanup: () => clearTimeout(t) };
  }

  async function fetchMETAR() {
    const tickerEl = document.getElementById("ticker");

    try {
      if (!METAR_PROXY) throw new Error("METAR_PROXY not set");

      const url = `${METAR_PROXY}?station=${encodeURIComponent(station)}`;
      const { ctrl, cleanup } = withTimeout(8000);

      let text;
      try {
        const resp = await fetch(url, { cache: "no-store", signal: ctrl.signal });
        if (!resp.ok) throw new Error("HTTP " + resp.status);
        text = await resp.text();
      } finally {
        cleanup();
      }

      const lines = String(text).trim().split(/\r?\n/).map(s => s.trim()).filter(Boolean);
      const raw = lines.find(l => /^(METAR|SPECI)\s/.test(l)) || null;

      if (!raw) throw new Error("No METAR line in proxy response");

      lastGoodRaw = raw;

      // ✅ Visibility extraction
      let visibilitySm = null;
      let m = raw.match(/\s(P6)SM\b/);
      if (m) visibilitySm = 6;

      if (visibilitySm == null) {
        m = raw.match(/\s(\d+)\s(\d+)\/(\d+)SM\b/); // 2 1/2SM
        if (m) visibilitySm = Number(m[1]) + (Number(m[2]) / Number(m[3]));
      }
      if (visibilitySm == null) {
        m = raw.match(/\s(\d+)\/(\d+)SM\b/); // 1/2SM
        if (m) visibilitySm = Number(m[1]) / Number(m[2]);
      }
      if (visibilitySm == null) {
        m = raw.match(/\s(\d+)SM\b/); // 10SM
        if (m) visibilitySm = Number(m[1]);
      }
      if (visibilitySm == null && /\bCAVOK\b/.test(raw)) visibilitySm = 6;

      // ✅ Ceiling extraction
      let ceilingFt = null;
      const ceilMatch = raw.match(/\s(BKN|OVC|VV)(\d{3})\b/);
      if (ceilMatch) ceilingFt = parseInt(ceilMatch[2], 10) * 100;

      const flightCat = determineFlightCategory(ceilingFt, visibilitySm);

      tickerEl.className = "ticker " + flightCat;
      tickerEl.textContent = `${flightCat}: ${raw}`;

    } catch (err) {
      console.error("Error loading METAR:", err);

      // Keep last known good to avoid constant scary errors
      if (lastGoodRaw) {
        tickerEl.className = tickerEl.className || "ticker UNK";
        tickerEl.textContent = tickerEl.textContent || `${station}: ${lastGoodRaw}`;
      } else {
        tickerEl.className = "ticker UNK";
        tickerEl.textContent = "METAR connection error";
      }
    }
  }


  /***************
   * MAIN
   ***************/
  const tickerEl = document.getElementById("ticker");
  let lastGoodRaw = null;

  async function fetchRawMetar() {
    if (!METAR_PROXY || METAR_PROXY.includes("PASTE_YOUR_SCRIPT_URL_HERE")) {
      throw new Error("METAR_PROXY not set");
    }

    const url = `${METAR_PROXY}?station=${encodeURIComponent(STATION)}`;

    const { ctrl, cleanup } = withTimeout(FETCH_TIMEOUT_MS);
    try {
      const resp = await fetch(url, { cache: "no-store", signal: ctrl.signal });
      if (!resp.ok) throw new Error("HTTP " + resp.status);
      const txt = await resp.text();
      const raw = parseNoaaTxtToRawMetar(txt);
      if (!raw) throw new Error("No METAR line in response");
      return raw;
    } finally {
      cleanup();
    }
  }

  function renderFromRaw(raw) {
    const visibilitySm = parseVisibilitySm(raw);
    const ceilingFt = parseCeilingFt(raw);
    const cat = determineFlightCategory(ceilingFt, visibilitySm, raw);

    tickerEl.className = "ticker " + cat;
    tickerEl.textContent = `${cat}: ${raw}`;
  }

  async function update() {
    try {
      const raw = await fetchRawMetar();
      lastGoodRaw = raw;
      renderFromRaw(raw);
    } catch (err) {
      console.error("METAR update failed:", err);

      // Fail gracefully: keep last known good, don’t spam scary message if we can avoid it
      if (lastGoodRaw) {
        renderFromRaw(lastGoodRaw);
      } else {
        tickerEl.className = "ticker UNK";
        tickerEl.textContent = "METAR connection error";
      }
    }
  }

  update();
  setInterval(update, REFRESH_MS);
</script>

</body>
</html>
