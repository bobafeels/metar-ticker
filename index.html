<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>METAR Ticker</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    :root{
      --font-size: 40px;
      --bar-height: 85px;
      --scroll-seconds: 30s;

      --vfr:  #26983d;
      --mvfr: #2b09e8;
      --ifr:  #f51e14;
      --lifr: #c93bf9;
      --unk:  #BDBDBD;
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background: transparent;
      font-family: Arial, sans-serif;
      font-size: var(--font-size);
    }

    #ticker-wrapper {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: var(--bar-height);
      line-height: var(--bar-height);
      overflow: hidden;
      white-space: nowrap;
      background: transparent;
    }

    .ticker {
      display: inline-block;
      padding-left: 100%;
      will-change: transform;
      animation: scroll var(--scroll-seconds) linear infinite;
      font-weight: 700;
      text-shadow: 0 0 4px rgba(0,0,0,0.9);
    }

    .VFR  { color: var(--vfr);  }
    .MVFR { color: var(--mvfr); }
    .IFR  { color: var(--ifr);  }
    .LIFR { color: var(--lifr); }
    .UNK  { color: var(--unk);  }

    @keyframes scroll {
      from { transform: translateX(0%); }
      to   { transform: translateX(-100%); }
    }
  </style>
</head>
<body>

  <div id="ticker-wrapper">
    <div class="ticker UNK" id="ticker">Loading METAR…</div>
  </div>

<script>
(() => {
  const STATION = "KAMW";
  const METAR_PROXY = "https://metar-ticker.sarah-cbauer11.workers.dev/"; // keep your URL
  const REFRESH_MS = 60000;
  const TIMEOUT_MS = 8000;

  let lastGoodRaw = null;

  function setStatus(text, cls = "UNK") {
    const el = document.getElementById("ticker");
    if (!el) return;
    el.className = "ticker " + cls;
    el.textContent = text;
  }

  // Show any uncaught errors on-screen (this is the key debugging tool)
  window.addEventListener("error", (e) => {
    setStatus("JS error: " + (e.message || "unknown"), "UNK");
  });
  window.addEventListener("unhandledrejection", (e) => {
    const msg = (e.reason && (e.reason.message || String(e.reason))) || "promise rejection";
    setStatus("Promise error: " + msg, "UNK");
  });

  function determineFlightCategory(ceilingFt, visibilitySm, raw) {
    if (visibilitySm == null) return "UNK";

    const noCeilingToken = raw && /\b(CLR|SKC|NSC)\b/.test(raw);
    if (ceilingFt == null || noCeilingToken) {
      if (visibilitySm < 1) return "LIFR";
      if (visibilitySm < 3) return "IFR";
      if (visibilitySm < 5) return "MVFR";
      return "VFR";
    }

    if (ceilingFt <= 500 || visibilitySm < 1) return "LIFR";
    if (ceilingFt <= 1000 || visibilitySm < 3) return "IFR";
    if (ceilingFt <= 3000 || visibilitySm < 5) return "MVFR";
    return "VFR";
  }

  function parseVisibilitySm(raw) {
    // P6SM
    let m = raw.match(/\s(P6)SM\b/);
    if (m) return 6;

    // "2 1/2SM"
    m = raw.match(/\s(\d+)\s(\d+)\/(\d+)SM\b/);
    if (m) return Number(m[1]) + (Number(m[2]) / Number(m[3]));

    // "1/2SM"
    m = raw.match(/\s(\d+)\/(\d+)SM\b/);
    if (m) return Number(m[1]) / Number(m[2]);

    // "10SM"
    m = raw.match(/\s(\d+)SM\b/);
    if (m) return Number(m[1]);

    // CAVOK (treat as good vis for category thresholds)
    if (/\bCAVOK\b/.test(raw)) return 6;

    return null;
  }

  function parseCeilingFt(raw) {
    const m = raw.match(/\s(BKN|OVC|VV)(\d{3})\b/);
    return m ? parseInt(m[2], 10) * 100 : null;
  }

  function parseRawMetarFromText(txt) {
    const lines = String(txt).trim().split(/\r?\n/).map(s => s.trim()).filter(Boolean);
    // Find METAR/SPECI line anywhere in response
    return lines.find(l => /^(METAR|SPECI)\s/.test(l)) || null;
  }

  async function fetchWithTimeout(url) {
    const ctrl = new AbortController();
    const t = setTimeout(() => ctrl.abort(), TIMEOUT_MS);
    try {
      const resp = await fetch(url, { cache: "no-store", signal: ctrl.signal });
      return resp;
    } finally {
      clearTimeout(t);
    }
  }

  async function update() {
    try {
      setStatus("Fetching METAR…", "UNK");

      if (!METAR_PROXY) throw new Error("METAR_PROXY not set");
      const url = `${METAR_PROXY}?station=${encodeURIComponent(STATION)}`;

      const resp = await fetchWithTimeout(url);
      if (!resp.ok) throw new Error("HTTP " + resp.status);

      const text = await resp.text();
      const raw = parseRawMetarFromText(text);
      if (!raw) throw new Error("No METAR line in proxy response");

      lastGoodRaw = raw;

      const vis = parseVisibilitySm(raw);
      const ceil = parseCeilingFt(raw);
      const cat = determineFlightCategory(ceil, vis, raw);

      setStatus(`${cat}: ${raw}`, cat);

    } catch (err) {
      const msg = err && (err.message || String(err));

      // If we have a last-good METAR, keep showing it instead of a scary blank/error
      if (lastGoodRaw) {
        const vis = parseVisibilitySm(lastGoodRaw);
        const ceil = parseCeilingFt(lastGoodRaw);
        const cat = determineFlightCategory(ceil, vis, lastGoodRaw);
        setStatus(`${cat}: ${lastGoodRaw}`, cat);
      } else {
        // IMPORTANT: show the real reason on screen so we can fix it
        setStatus("METAR error: " + msg, "UNK");
      }
    }
  }

  document.addEventListener("DOMContentLoaded", () => {
    update();
    setInterval(update, REFRESH_MS);
  });
})();
</script>
</body>
</html>
