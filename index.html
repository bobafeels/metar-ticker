<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>METAR Ticker</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    :root{
      --font-size: 40px;
      --bar-height: 85px;
      --scroll-seconds: 30s;

      --vfr:  #26983d;
      --mvfr: #2b09e8;
      --ifr:  #f51e14;
      --lifr: #c93bf9;
      --unk:  #BDBDBD;
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background: transparent;
      font-family: Arial, sans-serif;
      font-size: var(--font-size);
    }

    #ticker-wrapper {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: var(--bar-height);
      line-height: var(--bar-height);
      overflow: hidden;
      white-space: nowrap;
      background: transparent;
    }

    .ticker {
      display: inline-block;
      padding-left: 100%;
      will-change: transform;
      animation: scroll var(--scroll-seconds) linear infinite;
      font-weight: 700;
      text-shadow: 0 0 4px rgba(0,0,0,0.9);
    }

    .VFR  { color: var(--vfr);  }
    .MVFR { color: var(--mvfr); }
    .IFR  { color: var(--ifr);  }
    .LIFR { color: var(--lifr); }
    .UNK  { color: var(--unk);  }

    @keyframes scroll {
      from { transform: translateX(0%); }
      to   { transform: translateX(-100%); }
    }
  </style>
</head>
<body>

  <div id="ticker-wrapper">
    <div class="ticker UNK" id="ticker">Loading METAR…</div>
  </div>

<script>
  /***************
   * CONFIG
   ***************/
  const STATION = "KAMW";
  const METAR_PROXY = "https://metar-ticker.sarah-cbauer11.workers.dev"; // no trailing slash needed
  const REFRESH_MS = 60_000;

  let lastGoodRaw = null;

  function withTimeout(ms) {
    const ctrl = new AbortController();
    const t = setTimeout(() => ctrl.abort(), ms);
    return { ctrl, cleanup: () => clearTimeout(t) };
  }

  function determineFlightCategory(ceilingFt, visibilitySm, raw) {
    // If visibility is missing entirely, we can't classify
    if (visibilitySm == null) return "UNK";

    // Treat CLR/SKC/NSC/no-ceiling as "no ceiling" → classify by visibility only
    const noCeilingToken = raw && /\b(CLR|SKC|NSC)\b/.test(raw);
    if (ceilingFt == null || noCeilingToken) {
      if (visibilitySm < 1) return "LIFR";
      if (visibilitySm < 3) return "IFR";
      if (visibilitySm < 5) return "MVFR";
      return "VFR";
    }

    // Standard combined rules
    if (ceilingFt <= 500 || visibilitySm < 1) return "LIFR";
    if (ceilingFt <= 1000 || visibilitySm < 3) return "IFR";
    if (ceilingFt <= 3000 || visibilitySm < 5) return "MVFR";
    return "VFR";
  }

  async function fetchMETAR() {
    const tickerEl = document.getElementById("ticker");

    try {
      if (!METAR_PROXY) throw new Error("METAR_PROXY not set");

      // ✅ FIX: STATION (not station)
      const url = `${METAR_PROXY}?station=${encodeURIComponent(STATION)}`;

      const { ctrl, cleanup } = withTimeout(8000);

      let text;
      try {
        const resp = await fetch(url, { cache: "no-store", signal: ctrl.signal });
        if (!resp.ok) throw new Error("HTTP " + resp.status);
        text = await resp.text();
      } finally {
        cleanup();
      }

      const lines = String(text).trim().split(/\r?\n/).map(s => s.trim()).filter(Boolean);
      const raw = lines.find(l => /^(METAR|SPECI)\s/.test(l)) || null;
      if (!raw) throw new Error("No METAR line in proxy response");

      lastGoodRaw = raw;

      // ✅ Visibility extraction
      let visibilitySm = null;
      let m = raw.match(/\s(P6)SM\b/);
      if (m) visibilitySm = 6;

      if (visibilitySm == null) {
        m = raw.match(/\s(\d+)\s(\d+)\/(\d+)SM\b/); // 2 1/2SM
        if (m) visibilitySm = Number(m[1]) + (Number(m[2]) / Number(m[3]));
      }
      if (visibilitySm == null) {
        m = raw.match(/\s(\d+)\/(\d+)SM\b/); // 1/2SM
        if (m) visibilitySm = Number(m[1]) / Number(m[2]);
      }
      if (visibilitySm == null) {
        m = raw.match(/\s(\d+)SM\b/); // 10SM
        if (m) visibilitySm = Number(m[1]);
      }
      if (visibilitySm == null && /\bCAVOK\b/.test(raw)) visibilitySm = 6;

      // ✅ Ceiling extraction (BKN/OVC/VV)
      let ceilingFt = null;
      const ceilMatch = raw.match(/\s(BKN|OVC|VV)(\d{3})\b/);
      if (ceilMatch) ceilingFt = parseInt(ceilMatch[2], 10) * 100;

      const flightCat = determineFlightCategory(ceilingFt, visibilitySm, raw);

      tickerEl.className = "ticker " + flightCat;
      tickerEl.textContent = `${flightCat}: ${raw}`;

    } catch (err) {
      console.error("Error loading METAR:", err);

      // Keep last good if we have it
      if (lastGoodRaw) {
        tickerEl.className = tickerEl.className || "ticker UNK";
        tickerEl.textContent = `${tickerEl.textContent.includes(":") ? tickerEl.textContent.split(":")[0] : "UNK"}: ${lastGoodRaw}`;
      } else {
        tickerEl.className = "ticker UNK";
        tickerEl.textContent = "METAR connection error";
      }
    }
  }

  // ✅ Run it
  fetchMETAR();
  setInterval(fetchMETAR, REFRESH_MS);
</script>


</body>
</html>
